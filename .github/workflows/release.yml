name: Release VSCode Extension

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so we can count commits for versioning

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install vsce
        run: npm install -g @vscode/vsce
      
      - name: Compile TypeScript
        run: npm run compile
        
      - name: Derive version from package.json + commit count
        id: version
        run: |
          BASE=$(node -p "require('./package.json').version")
          COUNT=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short HEAD)
          echo "tag=v${BASE}-build.${COUNT}+${SHA}" >> "$GITHUB_OUTPUT"
          echo "label=${BASE}-build.${COUNT}+${SHA}" >> "$GITHUB_OUTPUT"

      - name: Package extension
        run: vsce package --out extension.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Build ${{ steps.version.outputs.label }}"
          body: |
            Automated build from commit ${{ github.sha }}

            **Branch:** `${{ github.ref_name }}`
            **Triggered by:** ${{ github.actor }}
          files: extension.vsix
          prerelease: true   # mark as pre-release since these are not manually tagged