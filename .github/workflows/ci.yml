name: CI

on:
  push:
    branches: [dev, production]
  pull_request:
    branches: [dev, production]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint and format
        run: npm run check

      - name: Compile
        run: npm run compile
